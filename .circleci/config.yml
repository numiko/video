version: 2.1

workflows:
  version: 2
  run_tests:
    jobs:
      - build-and-test

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.0-noble
    resource_class: medium

    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm clean-install
      - run:
          name: Install Chrome (needed for channel:'chrome' in playwright.config.js)
          command: npx playwright install chrome
          environment:
            DEBIAN_FRONTEND: noninteractive
      - run:
          name: Run Playwright tests
          command: npm test
      - store_test_results:
          path: reports/
      - store_artifacts:
          path: reports/
