<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package boilerplate</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style type="text/tailwindcss">
    .c-icon {
      @apply flex-shrink-0;
      @apply inline-block;
      @apply fill-current text-white;
      @apply h-16;
      aspect-ratio: 1;
    }

    .c-video-facade {
      @apply relative aspect-video w-full max-w-[600px] bg-black;

      iframe, video {
        @apply absolute top-0 left-0 w-full h-full;
      }
    }

    .c-video-ambient {
      @apply relative overflow-hidden bg-black;
      @apply absolute top-0 left-0 w-full h-full;
      container-type: size;

      iframe {
        @apply relative top-1/2 left-1/2 w-full h-full -translate-y-1/2 -translate-x-1/2 pointer-events-none;

        @container (min-aspect-ratio: 16/9) {
          height: 56.25vw;
        }

        @container (max-aspect-ratio: 16/9) {
          width: 177.78vh;
        }
      }

      video {
        @apply absolute top-0 left-0 w-full h-full object-cover;
      }
    }
  </style>
</head>

<body class="p-10">

  <!-- Icons For play, pause and loader -->
  <svg xmlns="http://www.w3.org/2000/svg" xmlns:link="http://www.w3.org/1999/xlink"
    style="position: absolute; width: 0px; height: 0px;">
    <symbol viewBox="0 0 24 24" id="animated-loader">
      <path
        d="M10.14 1.16a11 11 0 0 0-9 8.92A1.59 1.59 0 0 0 2.46 12a1.52 1.52 0 0 0 1.65-1.3 8 8 0 0 1 6.66-6.61A1.42 1.42 0 0 0 12 2.69a1.57 1.57 0 0 0-1.86-1.53Z">
        <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12"
          repeatCount="indefinite"></animateTransform>
      </path>
    </symbol>
    <symbol viewBox="0 0 24 24" id="material-pause">
      <path fill-rule="evenodd" d="M10 2H6v20h4zm8 0h-4v20h4z" clip-rule="evenodd"></path>
    </symbol>
    <symbol viewBox="0 0 24 24" id="material-play">
      <path d="M5 22V2l15 10z"></path>
    </symbol>
  </svg>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">

    <!-- Facade Embed - Vimeo  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Vimeo - Facade</h2>
      <div class="c-video-facade" data-js-video-with-facade data-js-video-id="958291103"
        data-js-video-provider="vimeo">

        <div data-js-video-player></div>

        <button type="button" data-js-video-facade class="h-full w-full flex items-center justify-center group"
          aria-label="Play video - Royalty Free Sample Video">
          <img src="https://picsum.photos/1000/563" alt="" loading="lazy"
            class="absolute top-0 left-0 w-full h-full object-cover" />
          <span class="c-button | relative z-10" data-component-id="numiko:button">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-play"></use>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <!-- Facade Embed - Youtube  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Youtube - Facade</h2>
      <div class="c-video-facade" data-js-video-with-facade data-js-video-id="G1hKzCkywM8" data-js-video-provider="youtube">

        <div data-js-video-player></div>

        <button type="button" data-js-video-facade class="h-full w-full flex items-center justify-center group"
          aria-label="Play video - Royalty Free Sample Video">
          <img src="https://picsum.photos/1000/563" alt="" loading="lazy"
            class="absolute top-0 left-0 w-full h-full object-cover" />
          <span class="c-button | relative z-10" data-component-id="numiko:button">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-play"></use>
            </svg>
          </span>
        </button>
      </div>

    </div>

    <!-- Facade - HTML5  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">HTML5 - Facade</h2>
      <div class="c-video-facade" data-js-video-with-facade  data-js-video-provider="html5">

        <video data-js-video-player class="absolute top-0 left-0 w-full h-full object-cover" preload="auto" playsinline disablepictureinpicture controls>
          <source src="https://player.vimeo.com/progressive_redirect/playback/958291103/rendition/1080p/file.mp4?loc=external&amp;log_user=0&amp;signature=43e4026b443ce02e10be32b9c1b973544678e52425064d0454f7cac23a10db1f" type="video/mp4">
        </video>

        <button type="button" data-js-video-facade class="h-full w-full flex items-center justify-center group"
          aria-label="Play video - Royalty Free Sample Video">
          <img src="https://picsum.photos/1000/563" alt="" loading="lazy"
            class="absolute top-0 left-0 w-full h-full object-cover" />
          <span class="c-button | relative z-10" data-component-id="numiko:button">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-play"></use>
            </svg>
          </span>
        </button>
      </div>

    </div>


    <!--  Embed - Vimeo  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Vimeo</h2>
      <div class="c-video-facade" data-js-video data-js-video-id="958291103"
        data-js-video-provider="vimeo">

        <div data-js-video-player></div>

      </div>
    </div>

    <!--  Embed - Youtube  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Youtube</h2>
      <div class="c-video-facade" data-js-video data-js-video-id="G1hKzCkywM8"
        data-js-video-provider="youtube">

        <div data-js-video-player></div>


      </div>

    </div>

    <!--  Embed - HTML5  -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">HTML5</h2>
      <div class="c-video-facade" data-js-video  data-js-video-provider="html5">

        <video data-js-video-player preload="auto" controls>
          <source src="https://player.vimeo.com/progressive_redirect/playback/958291103/rendition/1080p/file.mp4?loc=external&amp;log_user=0&amp;signature=43e4026b443ce02e10be32b9c1b973544678e52425064d0454f7cac23a10db1f" type="video/mp4">
        </video>

      </div>

    </div>

    <!-- Embed Hero - Vimeo -->
    <div>

      <h2 class="text-3xl mt-8 mb-4">Ambient - Vimeo</h2>

      <div class="w-full aspect-[4/1] relative">
        <div class="c-video-ambient" data-js-video-ambient data-js-video-provider="vimeo">

          <iframe
            data-js-video-player
            src="https://player.vimeo.com/video/958291103?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&background=1"
            frameborder="0" title="Video title">
          </iframe>

          <button type="button" data-js-video-button aria-pressed="false"
            aria-label="Play/Pause Video - Video title" class="absolute bottom-0 right-0 mb-5 mr-5 z-10">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-pause"></use>
            </svg>
          </button>

        </div>
      </div>
    </div>

    <!-- Embed Hero - Vimeo -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Ambient - Youtube</h2>

      <div class="w-full aspect-[4/1] relative">
        <div class="c-video-ambient" data-js-video-ambient data-js-video-provider="youtube">

          <iframe
            data-js-video-player
            src="https://www.youtube.com/embed/Jox6R5-rIH0?enablejsapi=1&controls=0&playlist=Jox6R5-rIH0&autoplay=1&mute=1&fs=0&disablekb=1&loop=1&playsinline=1&rel=0"
            frameborder="0" title="Video title">
          </iframe>

          <button type="button" data-js-video-button aria-pressed="false"
            aria-label="Play/Pause Video - Video title" class="absolute bottom-0 right-0 mb-5 mr-5 z-10">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-pause"></use>
            </svg>
          </button>

        </div>
      </div>

    </div>

    <!-- Embed Hero - HTML5 -->
    <div>
      <h2 class="text-3xl mt-8 mb-4">Ambient - HTML5</h2>

      <div class="w-full aspect-[4/1] relative">
        <div class="c-video-ambient" data-js-video-ambient data-js-video-provider="html5">

          <video
            data-js-video-player
            preload="auto"
            playsinline
            loop
            autoplay
            muted
            disablepictureinpicture="">
            <source src="https://player.vimeo.com/progressive_redirect/playback/958291103/rendition/1080p/file.mp4?loc=external&amp;log_user=0&amp;signature=43e4026b443ce02e10be32b9c1b973544678e52425064d0454f7cac23a10db1f" type="video/mp4">
          </video>

          <button type="button" data-js-video-button aria-pressed="false"
            aria-label="Play/Pause Video - Video title" class="absolute bottom-0 right-0 mb-5 mr-5 z-10">
            <svg class="c-icon" focusable="false" aria-hidden="true">
              <use href="#material-pause"></use>
            </svg>
          </button>

        </div>
      </div>

    </div>

  </div>


  <script type="module" src="./src/main.js"></script>
</body>

</html>
